<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeGraph</title>
<style>
:root{--bg:#0b0f17;--panel:#111723;--panel2:#161d2b;--panel3:#1c2536;--line:#232d40;--line2:#3a4760;--text:#e6ebf5;--mute:#8b98b0;--faint:#5b6880;
--accent:#6ea8ff;--accent2:#a78bfa;--out:#5eead4;--in:#fbbf24;--high:#f87171;--medium:#fbbf24;--low:#7c8aa5;--ok:#34d399;--shadow:0 12px 40px rgba(0,0,0,.45);
--mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,monospace;--sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
:root[data-theme=light]{--bg:#f5f7fb;--panel:#fff;--panel2:#f7f9fc;--panel3:#eef2f8;--line:#e1e7f0;--line2:#b9c4d6;--text:#172033;--mute:#5d6b84;--faint:#93a0b8;
--accent:#2563eb;--accent2:#7c3aed;--out:#0d9488;--in:#c2760a;--high:#dc2626;--medium:#c2760a;--low:#64748b;--ok:#059669;--shadow:0 12px 40px rgba(30,45,80,.16)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}
/* header */
#top{display:flex;align-items:center;gap:14px;height:52px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px}
.brand svg{width:22px;height:22px}
.proj{display:flex;align-items:center;gap:6px;max-width:260px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--mute)}
.proj b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj:hover{border-color:var(--line2)}
#tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
#tabs button{padding:5px 13px;border-radius:6px;color:var(--mute);font-weight:550}
#tabs button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
#tabs .n{margin-left:5px;font-size:11px;padding:0 6px;border-radius:9px;background:color-mix(in srgb,var(--high) 22%,transparent);color:var(--high)}
.search{position:relative;flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;padding:7px 10px 7px 30px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;outline:0}
.search input:focus{border-color:var(--accent)}
.search:before{content:"";position:absolute;left:10px;top:9px;width:9px;height:9px;border:1.6px solid var(--faint);border-radius:50%}
.search:after{content:"";position:absolute;left:19px;top:19px;width:5px;height:1.6px;background:var(--faint);transform:rotate(45deg)}
#qres{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:60vh;overflow:auto;padding:4px}
#qres div{padding:6px 9px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#qres div.on,#qres div:hover{background:var(--panel3)}
#qres small{color:var(--mute);margin-left:auto;font-family:var(--mono);font-size:11px;white-space:nowrap}
.btn{padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--panel3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ico{width:32px;padding:6px 0;text-align:center}
/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}
.view{display:flex;min-width:0;min-height:0}
.ctl{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
.ctl h4,.dh{margin:14px 0 6px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:700}
.ctl h4:first-child{margin-top:0}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.card p{margin:0;color:var(--mute)}
.card p.sum{color:var(--text);margin-bottom:6px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.card p.sum.all{display:block}
select,.sel{width:100%;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;outline:0}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{flex:1;white-space:nowrap;padding:4px 6px;border-radius:6px;color:var(--mute);font-weight:550}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
label.chk{display:flex;gap:8px;align-items:center;padding:3px 0;color:var(--mute);cursor:pointer}
label.chk input{accent-color:var(--accent)}
.legend div{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:6px;cursor:pointer;color:var(--mute)}
.legend div:hover{background:var(--panel3);color:var(--text)}
.legend div.off{opacity:.38}
.legend i,.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:var(--mono);font-size:11.5px}
.legend small{color:var(--faint)}
.stage{position:relative;flex:1;min-width:0;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#cv.drag{cursor:grabbing}
.zoomer{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoomer .btn{background:var(--panel)}
.hint{position:absolute;left:12px;bottom:12px;color:var(--faint);font-size:11.5px;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:4px 8px;border-radius:6px}
.keyrow{position:absolute;left:12px;top:12px;display:flex;gap:12px;color:var(--mute);font-size:11.5px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.keyrow span{display:flex;align-items:center;gap:5px}
.keyrow i{width:16px;height:2px;display:inline-block}
.keyrow b{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid}
#tip{position:fixed;z-index:60;max-width:420px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);pointer-events:none}
#tip .tn{font-family:var(--mono);font-weight:650}
#tip .tf{color:var(--mute);font-family:var(--mono);font-size:11px;margin:2px 0 6px}
#tip .td{white-space:pre-wrap;color:var(--text);max-height:190px;overflow:hidden}
#tip .nodoc{color:var(--faint);font-style:italic}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--text));white-space:nowrap}
.bdg i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.sev{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.sev.high{background:color-mix(in srgb,var(--high) 20%,transparent);color:var(--high)}
.sev.medium{background:color-mix(in srgb,var(--medium) 20%,transparent);color:var(--medium)}
.sev.low{background:color-mix(in srgb,var(--low) 22%,transparent);color:var(--low)}
/* detail */
#detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px;min-width:0}
#detail .empty{color:var(--faint);text-align:center;margin-top:80px;padding:0 20px}
.dn{font:650 15px var(--mono);word-break:break-all}
.dsig{font:12px var(--mono);color:var(--mute);word-break:break-word;margin-top:3px}
.dfile{font:11.5px var(--mono);color:var(--accent);margin-top:6px}
.dacts{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.ddoc{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;max-height:220px;overflow:auto}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-size:15px}.kv span{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
.lst a{display:flex;gap:7px;align-items:baseline;padding:3px 6px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px}
.lst a:hover{background:var(--panel3)}
.lst a small{margin-left:auto;color:var(--faint);white-space:nowrap}
.lst a em{font-style:normal;color:var(--faint);font-size:10.5px}
.cp{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:6px 8px;border-left:3px solid var(--c);background:var(--panel2);border-radius:0 8px 8px 0;margin-bottom:5px}
.cp .ln{font:11px var(--mono);color:var(--faint)}
.cp code{grid-column:2;font:11px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
pre.src{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 0;overflow:auto;font:11.5px/1.5 var(--mono);max-height:420px}
pre.src div{padding:0 10px 0 0;white-space:pre}
pre.src div.hot{background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 3px 0 0 var(--c)}
pre.src i{display:inline-block;width:42px;text-align:right;padding-right:10px;color:var(--faint);font-style:normal;user-select:none}
/* flow */
.fwrap{flex:1;display:flex;flex-direction:column;min-width:0}
.fbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.fbar select{width:auto;max-width:330px}
.fbar .sp{flex:1}
.fbar .lbl{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.stepper button{width:26px;height:28px;color:var(--mute)}.stepper b{min-width:20px;text-align:center}
#flowsc{flex:1;overflow:auto;padding:22px 26px 80px}
#flow{width:max-content;min-width:100%}
.fintro{max-width:820px;margin-bottom:18px;color:var(--mute)}
.fintro b{color:var(--text)}
.seq{display:flex;flex-direction:column;align-items:flex-start}
.step{position:relative;margin-top:18px}
.seq>.step:first-child{margin-top:0}
.seq>.step+.step:before{content:"";position:absolute;left:19px;top:-18px;height:18px;border-left:1.5px solid var(--line2)}
.seq>.step+.step:after{content:"";position:absolute;left:15.5px;top:-6px;border:4px solid transparent;border-top:6px solid var(--line2)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 11px 6px 8px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);cursor:pointer;font-family:var(--mono);font-size:12.5px;box-shadow:0 1px 0 rgba(0,0,0,.15);border-left:3px solid var(--fc,var(--line2))}
.chip:hover{border-color:var(--accent)}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.chip.inf{border-style:dashed}
.chip.root{padding:9px 14px 9px 10px;font-size:14px;font-weight:650;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--panel)),var(--panel))}
.chip .car{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;color:var(--mute);font-size:9px;background:var(--panel3);transition:transform .12s}
.chip.open .car{transform:rotate(90deg)}
.chip .car.none{visibility:hidden;width:2px}
.chip small{color:var(--faint);font-size:10.5px}
.chip .pips{display:inline-flex;gap:3px}.chip .pips i{width:7px;height:7px;border-radius:50%}
.chip .note{font:italic 11px var(--sans);color:var(--faint)}
.chip.ext{background:transparent;border:1px dashed var(--line2);border-left-width:1px;color:var(--mute);font-size:11.5px;padding:3px 9px;cursor:default}
.chip.ext.crit{border-style:solid;border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.sub{margin:8px 0 0 19px;padding:12px 0 2px 20px;border-left:1.5px dashed var(--line2)}
.blk{border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--panel2) 70%,transparent);padding:0 12px 12px}
.bh{display:inline-flex;align-items:center;gap:7px;margin:0 0 12px -12px;padding:4px 11px;border-radius:10px 0 10px 0;font:600 11.5px var(--mono);background:color-mix(in srgb,var(--bc) 16%,transparent);color:color-mix(in srgb,var(--bc) 78%,var(--text));border-right:1px solid color-mix(in srgb,var(--bc) 35%,transparent);border-bottom:1px solid color-mix(in srgb,var(--bc) 35%,transparent)}
.blk.loop{--bc:#a78bfa;border-color:color-mix(in srgb,var(--bc) 35%,var(--line))}
.blk.cond{--bc:#60a5fa}
.blk.fin{--bc:#94a3b8}
.arms{display:flex;gap:12px;align-items:stretch;padding-top:14px;border-top:1.5px solid var(--line2);position:relative}
.arm{position:relative;--bc:#60a5fa;border:1px solid color-mix(in srgb,var(--bc) 30%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--panel2) 70%,transparent);padding:0 12px 12px;min-width:120px}
.arm:before{content:"";position:absolute;left:19px;top:-15px;height:14px;border-left:1.5px solid var(--line2)}
.arm.else{--bc:#94a3b8}.arm.exc{--bc:#fb7185}.arm.try{--bc:#34d399}
.arm.sw{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--high) 9%,transparent) 0 8px,transparent 8px 16px)}
.dia{width:8px;height:8px;transform:rotate(45deg);background:var(--bc);border-radius:1.5px;flex:none}
.term{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:20px;font:11.5px var(--mono);border:1px solid var(--line2);color:var(--mute)}
.term.raise{border-color:color-mix(in srgb,var(--high) 50%,transparent);color:var(--high);background:color-mix(in srgb,var(--high) 10%,transparent)}
.term.ret{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.leaf{color:var(--faint);font-style:italic;font-size:11.5px;padding:2px 4px}
/* critical */
.cwrap{flex:1;overflow:auto;padding:18px 22px 60px;min-width:0}
.ctop{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ctop h2{margin:0 12px 0 0;font-size:17px}
.ctop .seg{width:auto}.ctop .seg button{padding:4px 12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-bottom:18px}
.cat{text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);border-left:3px solid var(--c);display:block}
.cat:hover{border-color:var(--line2);border-left-color:var(--c)}
.cat.on{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-color:var(--c)}
.cat b{font-size:19px;display:block;line-height:1.1}
.cat span{color:var(--mute);font-size:12px}
.fgrp{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.fgh{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;background:var(--panel2)}
.fgh b{font-family:var(--mono)}
.fgh em{font-style:normal;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fgh .cnt{display:flex;gap:5px}
.fn-row{border-top:1px solid var(--line);padding:9px 13px}
.fn-row .fnn{display:flex;gap:8px;align-items:center;cursor:pointer;flex-wrap:wrap}
.fn-row .fnn b{font-family:var(--mono)}
.fn-row .fnn:hover b{color:var(--accent)}
.it{display:grid;grid-template-columns:52px 150px minmax(180px,1fr) minmax(0,1.2fr);gap:10px;align-items:baseline;padding:3px 0 3px 4px;font-size:12px}
.it:first-of-type{margin-top:6px}
.it .ln{font-family:var(--mono);color:var(--faint)}
.it code{font:11.5px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* home */
#home{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.hbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:26px 28px}
.hbox h1{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px}
.hbox h1 svg{width:28px;height:28px}
.hbox>p{margin:0 0 18px;color:var(--mute)}
.prow{display:flex;gap:8px}
.prow input{flex:1;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;outline:0;font-family:var(--mono);font-size:12.5px}
.prow input:focus{border-color:var(--accent)}
.brow{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);max-height:230px;overflow:auto}
.crumb{position:sticky;top:0;display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel3);font-family:var(--mono);font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.crumb a{cursor:pointer;color:var(--accent)}
.dir{display:flex;gap:8px;padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:12px}
.dir:hover{background:var(--panel3)}
.dir:before{content:"";width:14px;height:10px;margin-top:4px;border-radius:2px;background:var(--in);opacity:.75;flex:none}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rec button{text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.rec button:hover{border-color:var(--accent)}
.rec b{display:block}.rec small{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:10.5px}
.prog{margin-top:16px}
.prog div{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--faint)}
.prog div.run{color:var(--text)}.prog div.done{color:var(--ok)}.prog div.fail{color:var(--high)}
.prog i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;flex:none}
.prog .run i{border-top-color:transparent;animation:spin .8s linear infinite}
.prog .done i{background:currentColor}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--high);margin-top:10px}
.notice{margin:0 0 12px;padding:8px 11px;border-radius:9px;border:1px solid color-mix(in srgb,var(--medium) 45%,transparent);background:color-mix(in srgb,var(--medium) 10%,transparent);color:var(--mute)}
@media(max-width:1100px){main{grid-template-columns:minmax(0,1fr) 300px}.ctl{width:210px}}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 6l6 6m0 0l6-5m-6 5v7" stroke="#6ea8ff"/><circle cx="5" cy="5" r="2.6" fill="#6ea8ff"/><circle cx="19" cy="6" r="2.6" fill="#a78bfa"/><circle cx="12" cy="12" r="2.8" fill="#5eead4"/><circle cx="12" cy="20" r="2.4" fill="#fbbf24"/></svg>CodeGraph</div>
  <button class="proj" id="bProj" title="Open another folder"><b id="pname">No folder</b><span>&#9662;</span></button>
  <nav id="tabs"><button data-tab="graph">Call graph</button><button data-tab="flow">Flow</button><button data-tab="crit">Critical points<span class="n" id="critN"></span></button></nav>
  <div class="search"><input id="q" placeholder="Search functions…   press /" autocomplete="off" spellcheck="false"><div id="qres" hidden></div></div>
  <button class="btn" id="bRescan" title="Re-read the code with the stored setup. No LLM call.">Rescan</button>
  <button class="btn" id="bSetup" title="Ask the LLM again for entry points, key functions and project rules.">Redo AI setup</button>
  <button class="btn ico" id="bTheme" title="Light / dark">&#9680;</button>
</header>
<main>
  <section class="view" id="v-graph">
    <aside class="ctl">
      <h4>Project</h4><div class="card" id="pcard"></div>

<div id="home" hidden><div class="hbox">
  <h1><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 6l6 6m0 0l6-5m-6 5v7" stroke="#6ea8ff"/><circle cx="5" cy="5" r="2.6" fill="#6ea8ff"/><circle cx="19" cy="6" r="2.6" fill="#a78bfa"/><circle cx="12" cy="12" r="2.8" fill="#5eead4"/><circle cx="12" cy="20" r="2.4" fill="#fbbf24"/></svg>Open a Python folder</h1>
  <p>The first open scans the code and makes one AI call to write the setup. After that the folder opens from the cache with no AI call.</p>
  <div class="prow"><input id="hPath" placeholder="/path/to/repo   or   D:\path\to\repo" spellcheck="false"><button class="btn pri" id="hOpen">Open</button><button class="btn" id="hClose" hidden>Cancel</button></div>
  <label class="chk" style="margin-top:8px"><input type="checkbox" id="hNoLLM">Skip the AI call (rule-based setup only)</label>

</div></div>
<script>window.__META__=/*__META__*/null;</script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat(9)){if(k==null||k===false||k==='')continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}
function set(el,...kids){const t=h('i',null,...kids);el.replaceChildren(...t.childNodes)}
const STATIC=!!window.__META__;
let M=null,N=[],E=[],OUT=[],IN=[],ENTRY=new Map();
const S={tab:'graph',sel:-1,root:-1,scope:'entry',layout:'layered',color:'file',inferred:true,isolated:false,fileOff:new Set(),depth:2,lib:false,ret:true,flowRoot:-1,critCat:null,critSev:'all'};
const SEVW={high:3,medium:2,low:1};
const fileColor=f=>`hsl(${(f*137.5+205)%360} 68% ${f%2?62:55}%)`;
const label=n=>n.k==='module'?n.n:n.q;
const where=n=>M.files[n.f].path+':'+n.l;
const topSev=n=>n.cr.reduce((a,c)=>SEVW[c.s]>SEVW[a]?c.s:a,'low');
const cats=n=>[...new Set(n.cr.map(c=>c.c))];
function badge(c,txt){return h('span',{class:'bdg',style:'--c:'+M.cats[c].color,title:M.cats[c].desc},h('i'),txt||M.cats[c].label)}

/* ---------- load ---------- */
function load(meta){
  M=meta;N=M.nodes;E=M.edges;OUT=N.map(()=>[]);IN=N.map(()=>[]);
  for(const e of E){OUT[e[0]].push({to:e[1],k:e[2],n:e[3],l:e[4]});IN[e[1]].push({to:e[0],k:e[2],n:e[3],l:e[4]})}
  ENTRY=new Map(M.entries.map(e=>[e.i,e]));
  S.sel=-1;S.fileOff=new Set();S.critCat=null;
  S.root=S.flowRoot=M.entries.length?M.entries[0].i:(N.length?0:-1);
  const reach=r=>{const s=new Set([r]),st=[r];while(st.length)for(const e of OUT[st.pop()])if(!s.has(e.to)){s.add(e.to);st.push(e.to)}return s.size};
  const small=S.root<0||(reach(S.root)<12&&N.length>30);S.scope=small?'all':'entry';S.layout=small?'force':'layered';
  $('#pname').textContent=M.name;document.title='CodeGraph · '+M.name;
  const c=M.stats.crit;$('#critN').textContent=c.high||'';$('#critN').hidden=!c.high;
  $('#bRescan').hidden=$('#bSetup').hidden=STATIC;
  const su=M.setup||{};
  set($('#pcard'),
    h('p',{class:'sum',title:'Click to expand',onclick:e=>e.currentTarget.classList.toggle('all')},su.summary||'No AI summary for this folder.'),
    h('p',{},`${M.stats.files} files · ${M.stats.functions} functions · ${M.stats.edges} calls · ${M.stats.loc.toLocaleString()} lines`),
    h('p',{style:'margin-top:6px;font-size:11.5px'},'Setup: ',h('b',{style:'color:'+(su.source==='claude'?'var(--ok)':'var(--medium)')},su.source==='claude'?'AI (cached)':'rules only'),' · scanned '+M.scanned_at),
    su.error&&h('p',{style:'margin-top:6px;font-size:11.5px;color:var(--medium)'},'AI setup failed: '+su.error),
    M.stats.errors?h('p',{style:'margin-top:6px;color:var(--high)'},M.stats.errors+' file(s) could not be parsed'):null);
  fillEntries();buildLegend();syncSeg();
  home(false);showDetail();setTab(S.tab);relayout();
}
function entryName(i){const e=ENTRY.get(i),n=N[i];return(e&&e.label?e.label+'  —  ':'')+(n.k==='module'?M.files[n.f].path:label(n)+'  ·  '+M.files[n.f].path)}
function fillEntries(){
  for(const[id,cur]of[['#gEntry',S.root],['#fEntry',S.flowRoot]]){
    const s=$(id);set(s);
    const g=h('optgroup',{label:'Entry points'});M.entries.forEach(e=>g.append(h('option',{value:e.i},entryName(e.i))));s.append(g);
    if(cur>=0&&!ENTRY.has(cur))s.append(h('optgroup',{label:'Chosen function'},h('option',{value:cur},entryName(cur))));
    s.value=cur;
  }
}
function syncSeg(){for(const[id,k]of[['#gScope','scope'],['#gLayout','layout'],['#gColor','color']])$$(id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===S[k]))}
function buildLegend(){
  const cnt=M.files.map(()=>0);N.forEach(n=>cnt[n.f]++);
  const order=M.files.map((f,i)=>i).filter(i=>cnt[i]).sort((a,b)=>cnt[b]-cnt[a]);
  $('#gFilesN').textContent='('+order.length+')';
  set($('#gFiles'),...order.map(i=>h('div',{class:S.fileOff.has(i)?'off':'',title:(M.files[i].role||M.files[i].path)+'\nClick: hide/show · Alt+click: only this file',onclick:ev=>{
    if(ev.altKey){const only=S.fileOff.size===order.length-1&&!S.fileOff.has(i);S.fileOff=new Set(only?[]:order.filter(x=>x!==i))}else S.fileOff.has(i)?S.fileOff.delete(i):S.fileOff.add(i);buildLegend();relayout()}},
    h('i',{style:'background:'+fileColor(i)}),h('span',{},M.files[i].path),h('small',{},cnt[i]))));
}

/* ---------- graph ---------- */
const cv=$('#cv'),g=cv.getContext('2d');
let V={x:0,y:0,k:1},P=[],VIS=[],VE=[],hover=-1,layered=true,CSSV={};
function css(){const s=getComputedStyle(document.documentElement);for(const k of['bg','panel','line','line2','text','mute','faint','accent','out','in','high','medium','low'])CSSV[k]=s.getPropertyValue('--'+k).trim()}
function visible(){
  let set;
  if(S.scope==='entry'&&S.root>=0){set=new Set([S.root]);const st=[S.root];while(st.length){for(const e of OUT[st.pop()]){if(e.k===2&&!S.inferred)continue;if(!set.has(e.to)){set.add(e.to);st.push(e.to)}}}}
  else set=new Set(N.keys());
  VIS=[...set].filter(i=>!S.fileOff.has(N[i].f));
  let vs=new Set(VIS);
  VE=E.filter(e=>vs.has(e[0])&&vs.has(e[1])&&(S.inferred||e[2]!==2));
  if(S.scope==='all'&&!S.isolated){const d=new Set();VE.forEach(e=>{d.add(e[0]);d.add(e[1])});VIS=VIS.filter(i=>d.has(i)||i===S.sel)}
}
function layoutLayers(){
  const vs=new Set(VIS),adj=new Map(VIS.map(i=>[i,[]])),radj=new Map(VIS.map(i=>[i,[]]));
  for(const e of VE){adj.get(e[0]).push(e[1]);radj.get(e[1]).push(e[0])}
  const depth=new Map(),layers=[];
  const bfs=r=>{if(depth.has(r))return;depth.set(r,0);const q=[r];for(let k=0;k<q.length;k++){const a=q[k];for(const b of adj.get(a))if(!depth.has(b)){depth.set(b,depth.get(a)+1);q.push(b)}}};
  if(S.scope==='entry'&&vs.has(S.root))bfs(S.root);
  else{M.entries.forEach(e=>vs.has(e.i)&&bfs(e.i));VIS.filter(i=>!radj.get(i).length).sort((a,b)=>adj.get(b).length-adj.get(a).length).forEach(bfs)}
  [...VIS].sort((a,b)=>adj.get(b).length-adj.get(a).length).forEach(bfs);
  for(const i of VIS)(layers[depth.get(i)]=layers[depth.get(i)]||[]).push(i);
  const pos=new Map();layers.forEach(L=>L.forEach((i,k)=>pos.set(i,k)));
  const bary=(L,nb)=>{const key=new Map(L.map(i=>{const ns=nb.get(i).filter(j=>depth.get(j)!==depth.get(i));return[i,ns.length?ns.reduce((s,j)=>s+pos.get(j)/Math.max(1,layers[depth.get(j)].length-1||1),0)/ns.length:pos.get(i)/Math.max(1,L.length-1)]}));L.sort((a,b)=>key.get(a)-key.get(b));L.forEach((i,k)=>pos.set(i,k))};
  for(let s=0;s<6;s++){for(let d=1;d<layers.length;d++)bary(layers[d],radj);for(let d=layers.length-2;d>=0;d--)bary(layers[d],adj)}
  const maxL=Math.max(...layers.map(L=>L.length),1),GY=maxL>60?24:34;
  layers.forEach((L,d)=>L.forEach((i,k)=>{P[i]={x:d*250,y:(k-(L.length-1)/2)*GY}}));
}
function layoutForce(){
  const n=VIS.length,ix=new Map(VIS.map((i,k)=>[i,k])),x=new Float32Array(n),y=new Float32Array(n),dx=new Float32Array(n),dy=new Float32Array(n);
  const files=[...new Set(VIS.map(i=>N[i].f))],fpos=new Map(files.map((f,k)=>{const r=22*Math.sqrt(k+.5)*Math.sqrt(n/files.length+2),a=k*2.39996;return[f,[r*Math.cos(a),r*Math.sin(a)]]}));
  VIS.forEach((i,k)=>{const c=fpos.get(N[i].f),a=k*2.39996,r=14*Math.sqrt(k%40+1);x[k]=c[0]+r*Math.cos(a);y[k]=c[1]+r*Math.sin(a)});
  const K=52,iters=Math.max(40,Math.min(320,Math.round(160000/(n+1))));let t=90;
  for(let it=0;it<iters;it++){
    dx.fill(0);dy.fill(0);
    for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){let ux=x[a]-x[b],uy=y[a]-y[b],d2=ux*ux+uy*uy+.01;if(d2>360000)continue;const f=K*K/d2;ux*=f;uy*=f;dx[a]+=ux;dy[a]+=uy;dx[b]-=ux;dy[b]-=uy}
    for(const e of VE){const a=ix.get(e[0]),b=ix.get(e[1]);let ux=x[a]-x[b],uy=y[a]-y[b];const d=Math.sqrt(ux*ux+uy*uy)+.01,f=d/K*(e[2]===2?.4:1);ux*=f;uy*=f;dx[a]-=ux;dy[a]-=uy;dx[b]+=ux;dy[b]+=uy}
    const cx=new Map(),cn=new Map();VIS.forEach((i,k)=>{const f=N[i].f,c=cx.get(f)||[0,0];c[0]+=x[k];c[1]+=y[k];cx.set(f,c);cn.set(f,(cn.get(f)||0)+1)});
    VIS.forEach((i,k)=>{const f=N[i].f,c=cx.get(f),m=cn.get(f);dx[k]+=(c[0]/m-x[k])*.9-x[k]*.09;dy[k]+=(c[1]/m-y[k])*.9-y[k]*.09});
    for(let k=0;k<n;k++){const l=Math.sqrt(dx[k]*dx[k]+dy[k]*dy[k])+.01,m=Math.min(l,t)/l;x[k]+=dx[k]*m;y[k]+=dy[k]*m}
    t=Math.max(1.5,t*.975);
  }
  VIS.forEach((i,k)=>{P[i]={x:x[k],y:y[k]}});
}
function relayout(keepView){
  if(!M)return;visible();P=[];layered=S.layout==='layered';
  if(VIS.length){layered?layoutLayers():layoutForce()}
  const tot=N.length;
  $('#gHint').textContent=VIS.length?`${VIS.length} of ${tot} nodes · ${VE.length} calls · scroll to zoom, drag to pan, click a node`:'Nothing to show with these filters';
  if(!keepView)fit();else draw();
}
function size(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);return r}
function fit(){
  const r=size();if(!VIS.length){draw();return}
  let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const i of VIS){const p=P[i];a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y)}
  const padR=layered?190:70,w=c-a+70+padR,hh=d-b+120;
  V.k=Math.max(.08,Math.min(1.5,r.width/w,r.height/hh));
  if(layered&&V.k<.45){V.k=.45;V.x=60-a*V.k;V.y=r.height/2-(P[S.scope==='entry'&&P[S.root]?S.root:VIS[0]].y)*V.k}
  else{V.x=(r.width-(c-a+padR-70)*V.k)/2-a*V.k;V.y=(r.height-(d-b)*V.k)/2-b*V.k}
  draw();
}
const rad=i=>Math.min(13,4.5+1.5*Math.sqrt(OUT[i].length+IN[i].length));
function nodeFill(i){const n=N[i];if(S.color==='file')return fileColor(n.f);return n.rs>=8?CSSV.high:n.rs>=4?CSSV.medium:n.rs>0?'#5b8def':CSSV.faint}
function edgePath(a,b,ra,rb){
  if(layered){const x1=a.x+ra,x2=b.x-rb;if(b.x>a.x){const m=Math.max(40,(x2-x1)/2);g.moveTo(x1,a.y);g.bezierCurveTo(x1+m,a.y,x2-m,b.y,x2,b.y);return[x2-m,b.y,x2,b.y]}
    const off=60+Math.abs(a.y-b.y)*.25;g.moveTo(a.x,a.y-ra);g.bezierCurveTo(a.x+off,a.y-off,b.x+off,b.y-off-(a.x===b.x?0:20),b.x+rb*.7,b.y-rb*.7);return[b.x+off,b.y-off,b.x+rb*.7,b.y-rb*.7]}
  const d=Math.hypot(b.x-a.x,b.y-a.y)||1,ux=(b.x-a.x)/d,uy=(b.y-a.y)/d;g.moveTo(a.x+ux*ra,a.y+uy*ra);g.lineTo(b.x-ux*rb,b.y-uy*rb);return[a.x,a.y,b.x-ux*rb,b.y-uy*rb]
}
function arrow(t,s){const an=Math.atan2(t[3]-t[1],t[2]-t[0]);g.beginPath();g.moveTo(t[2],t[3]);g.lineTo(t[2]-s*Math.cos(an-.42),t[3]-s*Math.sin(an-.42));g.lineTo(t[2]-s*Math.cos(an+.42),t[3]-s*Math.sin(an+.42));g.closePath();g.fill()}
function draw(){
  if(!M||S.tab!=='graph')return;
  const d=devicePixelRatio||1,W=cv.width/d,H=cv.height/d;g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);
  g.save();g.translate(V.x,V.y);g.scale(V.k,V.k);
  const foc=hover>=0?hover:S.sel,fo=new Set(),fi=new Set();
  if(foc>=0){OUT[foc].forEach(e=>fo.add(e.to));IN[foc].forEach(e=>fi.add(e.to))}
  const lw=1/Math.max(V.k,.35),arrows=VE.length<2500;
  for(const pass of[0,1])for(const e of VE){
    const hot=foc>=0&&(e[0]===foc||e[1]===foc);if(hot!==!!pass)continue;
    const a=P[e[0]],b=P[e[1]];if(!a||!b)continue;
    const col=hot?(e[0]===foc?CSSV.out:CSSV.in):CSSV.line2;
    g.globalAlpha=hot?.95:foc>=0?.18:.55;g.strokeStyle=g.fillStyle=col;g.lineWidth=(hot?1.9:1)*lw;g.setLineDash(e[2]===2?[4*lw,4*lw]:e[2]===1?[1.5*lw,3*lw]:[]);
    g.beginPath();const t=edgePath(a,b,rad(e[0]),rad(e[1])+2);g.stroke();g.setLineDash([]);
    if(arrows||hot)arrow(t,(hot?8:6)*Math.max(1,lw*.8));
  }
  const showAll=V.k>.55||VIS.length<70;
  g.textBaseline='middle';g.font=`${Math.max(10.5,Math.min(14,12*V.k))/V.k}px ui-monospace,Consolas,Menlo,monospace`;
  for(const i of VIS){
    const p=P[i],n=N[i],r=rad(i),near=foc<0||i===foc||fo.has(i)||fi.has(i);
    g.globalAlpha=near?1:.25;
    if(n.k==='module'){g.beginPath();g.roundRect(p.x-r,p.y-r,2*r,2*r,3);} else {g.beginPath();g.arc(p.x,p.y,r,0,6.2832)}
    g.fillStyle=nodeFill(i);g.fill();
    const sv=n.cr.length?topSev(n):null;
    if(sv&&sv!=='low'){g.lineWidth=2.2;g.strokeStyle=sv==='high'?CSSV.high:CSSV.medium;g.beginPath();g.arc(p.x,p.y,r+3,0,6.2832);g.stroke()}
    if(ENTRY.has(i)||i===S.root&&S.scope==='entry'){g.lineWidth=1.6;g.strokeStyle=CSSV.accent;g.beginPath();g.arc(p.x,p.y,r+6.5,0,6.2832);g.stroke();g.beginPath();g.arc(p.x,p.y,r+9.5,0,6.2832);g.stroke()}
    if(i===S.sel){g.lineWidth=2.5;g.strokeStyle=CSSV.text;g.beginPath();g.arc(p.x,p.y,r+1.2,0,6.2832);g.stroke()}
    if(showAll||i===foc||(foc>=0&&near)||OUT[i].length+IN[i].length>7||ENTRY.has(i)){
      const hot=i===foc||i===S.sel;g.fillStyle=hot?CSSV.text:CSSV.mute;if(hot)g.font=g.font.replace(/^(bold )?/,'bold ');
      const tx=label(n);g.fillText(tx.length>34?tx.slice(0,33)+'…':tx,p.x+r+(ENTRY.has(i)?13:7),p.y);if(hot)g.font=g.font.replace(/^bold /,'');
    }
  }
  g.restore();g.globalAlpha=1;
}
function hit(mx,my){const x=(mx-V.x)/V.k,y=(my-V.y)/V.k;let best=-1,bd=1e9;for(const i of VIS){const p=P[i],d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=i}}return best>=0&&bd<=rad(best)+6/Math.min(1,V.k)?best:-1}
let drag=null;
cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect(),i=hit(e.clientX-r.left,e.clientY-r.top);drag={x:e.clientX,y:e.clientY,node:i,moved:false};cv.classList.add('drag')});
window.addEventListener('mousemove',e=>{
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(drag.moved){if(drag.node>=0){P[drag.node].x+=dx/V.k;P[drag.node].y+=dy/V.k}else{V.x+=dx;V.y+=dy}drag.x=e.clientX;drag.y=e.clientY;tip();draw()}return}
  if(e.target!==cv){if(hover>=0){hover=-1;draw()}return}
